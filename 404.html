<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | BuoyantWisdom</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .error-hero {
      flex: 1;
      background: linear-gradient(160deg, #4caf50 0%, #2a7a2a 15%, #2a5298 45%, #b8cfe8 100%);
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      padding: 80px 80px;
      gap: 60px;
      min-height: calc(100vh - 120px);
    }
    .error-title {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 3.5vw, 2.8rem);
      font-weight: 400;
      color: var(--navy-dark);
      line-height: 1.3;
      margin-bottom: 40px;
    }
    .btn-home {
      display: inline-block;
      background: rgba(180,210,240,0.7);
      color: var(--navy-dark);
      padding: 14px 32px;
      border-radius: 999px;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: 1px solid rgba(100,150,200,0.4);
      transition: background 0.2s, transform 0.15s;
    }
    .btn-home:hover { background: rgba(180,210,240,0.95); transform: translateY(-1px); }
    .error-graphic { display: flex; align-items: center; justify-content: center; }
    .error-circle {
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: rgba(230,238,248,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    }
    .error-number {
      font-family: var(--font-display);
      font-size: clamp(4rem, 8vw, 6rem);
      font-weight: 600;
      color: var(--navy-dark);
      letter-spacing: -0.02em;
    }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    @media (max-width: 768px) {
      .error-hero { grid-template-columns: 1fr; padding: 60px 24px; text-align: center; min-height: auto; }
      .error-circle { width: 240px; height: 240px; margin: 0 auto; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <a href="index.html" class="nav-logo">
      <img src="images/BW/BuoyantWisdomcropped.jpg" alt="Buoyant Wisdom — Sentiments To Keep Us Afloat">
    </a>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="#">Product</a></li>
      <li><a href="index.html#contact" class="btn-signup">SIGN UP</a></li>
    </ul>
    <button class="nav-hamburger" id="hamburger" aria-label="Open menu" onclick="toggleNav()">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <section class="error-hero">
    <div class="error-content">
      <h1 class="error-title">Oops, this page has been removed or does not exist.</h1>
      <a href="index.html" class="btn-home">Back to Home</a>
    </div>
    <div class="error-graphic">
      <div class="error-circle">
        <span class="error-number">404</span>
      </div>
    </div>
  </section>

  <script>
    function toggleNav() {
      document.getElementById('nav-links').classList.toggle('open');
    }
  </script>
</body>
</html>
